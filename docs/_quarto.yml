project:
  type: website
  output-dir: _site
  render:
    - "*.md"
    - "*.qmd"

website:
  title: "Library"
  description: "One page that gathers AB//LABS' public guides, lists and tools for intelligence work on illicit trade."
  site-url: https://atlas-bear.github.io/
  repo-url: https://github.com/atlas-bear/atlas-bear.github.io
  repo-subdir: docs
  repo-actions: [issue]
  favicon: favicon.svg
  page-navigation: false
  navbar:
    left:
      - text: Guides and lists
        href: index.md#guides-and-lists
      - text: Tools and platforms
        href: index.md#tools-and-platforms
      - text: Who we are
        href: index.md#who-we-are
    right:
      - text: ab-labs.io
        href: https://ab-labs.io
      - text: "Atlas|Bear"
        href: https://atlasbear.co
  page-footer:
    left: "Copyright 2024-2026 AB//LABS (formerly Atlas|Bear Labs). Page licensed MIT; the resources carry their own licences."
    right:
      - text: GitHub
        href: https://github.com/atlas-bear
      - text: Waterline
        href: https://maraiq.substack.com/
      - text: Contact
        href: mailto:support@ab-labs.io

format:
  atlas-bear/theme-html:
    include-after-body:
      text: '<script src="repo-stats.js" data-repo="atlas-bear/atlas-bear.github.io"></script>'
    grid:
      sidebar-width: 0px
      body-width: 1000px
      margin-width: 0px
      gutter-width: 1.5rem
    toc: false
