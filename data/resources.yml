# The resources shown on the Library page. scripts/build.py renders docs/index.md from this file.
# Each resource: title, one plain sentence, the main link (site), a repository, optional extra links, and the
# GitHub repository used for the last-commit badge.

groups:
  - title: Guides and lists
    resources:
      - title: AI-Enhanced OSINT
        line: A practical guide to using AI in intelligence work on illicit trade, with the OPSEC rules that apply to every tool we list.
        site: https://atlas-bear.github.io/osint-ai-guide/
        repo: https://github.com/atlas-bear/osint-ai-guide
        badge: atlas-bear/osint-ai-guide
        links:
          - {label: Latest release, url: https://github.com/atlas-bear/osint-ai-guide/releases/latest}
          - {label: Cite (DOI), url: https://doi.org/10.5281/zenodo.23314064}
      - title: Maritime and Supply Chain OSINT Tools
        line: The tools and data sources we use to track ships, cargo and trade, each verified, with who runs it and what it costs.
        site: https://atlas-bear.github.io/osint-tools/
        repo: https://github.com/atlas-bear/osint-tools
        badge: atlas-bear/osint-tools
        links:
          - {label: tools.json, url: https://github.com/atlas-bear/osint-tools/blob/main/tools.json}
          - {label: Propose a tool, url: https://github.com/atlas-bear/osint-tools/issues/new/choose}
      - title: Recommended Reading
        line: Books, reports and papers for people working on illicit trade, with full citations and downloads for Zotero and BibTeX.
        site: https://atlas-bear.github.io/recommended-reading/
        repo: https://github.com/atlas-bear/recommended-reading
        badge: atlas-bear/recommended-reading
        links:
          - {label: BibTeX, url: https://github.com/atlas-bear/recommended-reading/blob/main/exports/reading-list.bib}
          - {label: CSL JSON, url: https://github.com/atlas-bear/recommended-reading/blob/main/exports/reading-list.json}
  - title: Tools and platforms
    resources:
      - title: MARA
        line: Our maritime security intelligence platform, with round-the-clock incident monitoring, alerts, reports and country and port indices.
        site: https://maraiq.com/
        repo: https://github.com/atlas-bear/mara-roadmap
        badge: atlas-bear/mara-roadmap
        links:
          - {label: Roadmap and feedback, url: https://github.com/atlas-bear/mara-roadmap}
          - {label: Waterline newsletter, url: https://maraiq.substack.com/}
      - title: equasis-cli
        line: Look up vessels, inspections, ownership history and company fleets in Equasis from the command line, in batches.
        site: https://github.com/rhinonix/equasis-cli
        repo: https://github.com/rhinonix/equasis-cli
        badge: rhinonix/equasis-cli
        links:
          - {label: PyPI, url: https://pypi.org/project/equasis-cli/}
      - title: cue-kit
        line: Turn a video into extracted frames and a timestamped transcript that a language model can read, with a Claude Code skill.
        site: https://github.com/atlas-bear/cue-kit
        repo: https://github.com/atlas-bear/cue-kit
        badge: atlas-bear/cue-kit
        links:
          - {label: PyPI, url: https://pypi.org/project/cue-kit/}
