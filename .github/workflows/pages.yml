name: Publish site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/**"
      - "data/**"
      - requirements.txt
      - .github/workflows/pages.yml
  repository_dispatch:
    types: [site-deployed]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python scripts/build.py --check
      - name: Build the search index from the live sites
        run: python scripts/build_search.py
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.19"
      - run: quarto render docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
