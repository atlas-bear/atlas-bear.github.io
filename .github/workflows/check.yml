name: Check site

on:
  pull_request:
  push:
    branches: [main]

env:
  NO_MKDOCS_2_WARNING: "1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - name: docs/index.md matches data/resources.yml
        run: python scripts/build.py --check
      - name: Site builds without warnings
        run: mkdocs build --strict
      - name: Markdown lint
        run: npx --yes markdownlint-cli2 "README.md" "docs/**/*.md"
